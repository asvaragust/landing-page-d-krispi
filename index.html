<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>landing-page</title>

    <link rel="stylesheet" href="src/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  </head>
  <body>

    <!-- ========== -->
    <!-- NAVBAR -->
    <!-- ========== -->
    <section id="navbar" class="
    min-h-[10vh] max-h-[15vh] 
    flex justify-between items-center 
    p-4 
    bg-linear-to-r from-[var(--primary)] to-[var(--primary-shade)]
    text-[var(--text)]">

      <!-- = LOGO = -->
      <h1 class="text-2xl font-bold border-b-2 border-[var(--tertiary-shade)] p-2 cursor-pointer">Rak Hotwheels, N. G.</h1>

      <!-- = NAVLINKS = -->
      <nav class="w-[60%]">
        <ul class="navlinks w-full flex justify-center items-center gap-16">
          <li><a href="#home">Home</a></li>
          <li><a href="#produk">Produk</a></li>
          <li><a href="#penawaran">Penawaran</a></li>
          <li><a href="#kontak">Kontak</a></li>
        </ul>
      </nav>

      <!-- = CTA = -->
      <button class="
      bg-linear-to-r from-[var(--secondary)] to-[var(--secondary-shade)]
      font-[500] text-[var(--text-dim)]
      p-4
      rounded
      shadow-[0_4px_16px_var(--secondary)]
      outline-[var(--secondary)]
      
      hover:-translate-y-2

      focus:outline-2
      focus:outline-[var(--secondary)]
      focus: outline-offset-4
      
      transition-all duration-300">
        HUBUNGI PENJUAL
      </button>
    </section>
    

    <!-- ========== -->
    <!-- HOME -->
    <!-- ========== -->
    <section id="home" class="
    h-[90vh] bg-[linear-gradient(to_bottom,rgba(0,0,0,0.6),rgba(0,0,0,0.6)),url('/assets/hero-bg.jpeg')] bg-cover bg-center bg-no-repeat
    grid grid-cols-2 p-16 gap-8">

      <!-- = MAIN CONTENT = -->
      <div class="w-full h-full py-6">
        <h2 class="text-4xl text-[var(--text-dim)] leading-16">Pajang Hotwheels kalian dengan rak kami.</h2>

        <p class="text-[var(--text-mute)] py-6 my-4">Rak Hotwheels N’s Garage menyediakan Rak Hotwheels yang berkualitas, buatan dari seorang pengrajin yang sudah berpengalaman. Kami menyediakan harga dengan menyesuaikan kebutuhan anda!</p>


        <!-- = CTA = -->
        <div class="flex gap-12">
          <button class="
          bg-linear-to-r from-[var(--secondary)] to-[var(--secondary-shade)]
          font-[500] text-[var(--text-dim)]
          p-4
          rounded
          shadow-[0_4px_16px_var(--secondary)]
          outline-[var(--secondary)]
          
          hover:-translate-y-2

          focus:outline-2
          focus:outline-[var(--secondary)]
          focus: outline-offset-4
          
          transition-all duration-300">
            HUBUNGI PENJUAL
          </button>
          <button class="
          outline-2
          outline-[var(--tertiary)]
          rounded
          p-6
          text-[var(--text-dim)]

          hover:bg-[var(--tertiary-shade)]/50
          hover:shadow-[0px_8px_24px_var(--tertiary)]
          hover:-translate-y-2

          focus:outline-offset-4

          transition-all
          duration-300
          ">
            LIHAT PRODUK
          </button>
        </div>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
